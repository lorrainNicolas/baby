<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Compteur Baby-foot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Barlow:wght@400;600;700&family=DM+Mono:wght@500&display=swap">
<style>
  /* Concept : l'image de la scène en grand, avec le tableau noir qui compte vraiment les jours, et le détail du temps écoulé juste en dessous. */
  :root {
    --felt: #0e3b2a;
    --felt-stripe: #12452f;
    --chalk: #f4f1e8;
    --chalk-dim: #b9cfc1;
    --ball: #ffd23f;
    --red: #e5383b;
    --tear: #9bd8ff;
    --display: "Bowlby One", "Arial Black", Impact, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--felt);
    background-image: repeating-linear-gradient(90deg, var(--felt) 0 64px, var(--felt-stripe) 64px 128px);
    color: var(--chalk);
    font-family: var(--body);
    font-size: 1.0625rem;
    line-height: 1.5;
    padding-inline: 1rem;
    padding-block: 1.5rem 2.5rem;
    min-height: 100%;
  }

  .wrap {
    max-width: 46rem;
    margin-inline: auto;
    display: grid;
    gap: 1.25rem;
  }

  header { min-width: 0; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 0.8125rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--chalk-dim);
    margin: 0 0 0.4rem;
  }

  h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(1.4rem, 5vw, 2.1rem);
    line-height: 1.15;
    margin: 0;
    text-wrap: balance;
  }

  /* La scène */
  .scene {
    position: relative;
    margin: 0;
    border: 3px solid var(--chalk);
    border-radius: 0.5rem;
    overflow: hidden;
    background: #000;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .stage {
    position: relative;
    transform-origin: 28% 28%;
    animation: breathe 5s ease-in-out infinite alternate;
  }

  @keyframes breathe {
    from { transform: scale(1); }
    to   { transform: scale(1.04); }
  }

  .stage img { display: block; width: 100%; height: auto; }

  .overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .tile { fill: #1d1a1b; stroke: #2e2829; stroke-width: 2; }
  .seam { stroke: #0b0a0a; stroke-width: 3; }
  .num {
    font-family: "Barlow", "Arial", sans-serif;
    font-weight: 700;
    font-size: 92px;
    fill: #c4b4b3;
    text-anchor: middle;
    dominant-baseline: central;
    font-variant-numeric: tabular-nums;
  }

  .digit { transform-box: fill-box; transform-origin: center; }
  .digit.flip { animation: flip 0.22s ease-out; }

  @keyframes flip {
    from { transform: scaleY(0.05); }
    to   { transform: scaleY(1); }
  }

  .tv-glow {
    fill: #bcd8ff;
    opacity: 0;
    animation: flicker 3.2s steps(1, end) infinite;
  }

  @keyframes flicker {
    0%   { opacity: 0; }
    8%   { opacity: 0.07; }
    10%  { opacity: 0; }
    41%  { opacity: 0.05; }
    43%  { opacity: 0.01; }
    70%  { opacity: 0.08; }
    74%  { opacity: 0; }
  }

  .fall, .spark { fill: var(--tear); stroke: #ffffff; stroke-opacity: 0.55; stroke-width: 1.5; }
  .fall { opacity: 0; animation: fall 1.7s ease-in infinite; }

  @keyframes fall {
    0%   { transform: translateY(0); opacity: 0; }
    15%  { opacity: 0.95; }
    100% { transform: translateY(190px); opacity: 0; }
  }

  .spark {
    opacity: 0;
    animation: spark 1.2s ease-out both;
  }

  .spark.loop { animation-iteration-count: infinite; }

  @keyframes spark {
    0%   { transform: translate(0, 0); opacity: 0; }
    10%  { opacity: 1; }
    50%  { transform: translate(calc(var(--dx) * 0.6), var(--up)); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
  }

  /* Détail du temps */
  .below {
    display: grid;
    gap: 1rem;
  }

  .clock {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 0.5rem;
    margin: 0;
  }

  .clock div {
    background: rgba(0, 0, 0, 0.35);
    border: 2px solid var(--chalk);
    border-radius: 0.5rem;
    padding: 0.5rem 0.25rem 0.4rem;
    text-align: center;
    min-width: 0;
  }

  .clock b {
    display: block;
    font-family: var(--mono);
    font-weight: 500;
    font-size: clamp(1.5rem, 7vw, 2.4rem);
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }

  .clock .d b { color: var(--ball); }

  .clock span {
    font-family: var(--mono);
    font-size: 0.6875rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--chalk-dim);
  }

  .talk {
    display: flex;
    gap: 1rem;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
  }

  .talk > div { min-width: 0; flex: 1 1 16rem; }

  .verdict {
    margin: 0 0 0.25rem;
    font-weight: 600;
    text-wrap: balance;
  }

  .last-win { margin: 0; color: var(--chalk-dim); font-size: 0.9375rem; }
  .last-win strong { color: var(--chalk); font-weight: 600; }

  button {
    font-family: var(--display);
    font-size: 1rem;
    color: #12281d;
    background: var(--ball);
    border: 0;
    border-radius: 0.5rem;
    padding: 0.7rem 1.1rem;
    box-shadow: 0 4px 0 var(--red);
    cursor: pointer;
  }

  button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--red); }
  button:focus-visible, .scene:focus-visible { outline: 3px solid var(--chalk); outline-offset: 3px; }

  .hug {
    font-family: var(--mono);
    font-size: 0.8125rem;
    color: var(--chalk-dim);
    margin: 0.5rem 0 0;
  }

  @media (max-width: 30rem) {
    .talk { align-items: stretch; }
    button { width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .stage, .tv-glow, .digit.flip, .spark { animation: none; }
    .fall { animation: none; opacity: 0.85; }
    .spark { opacity: 0; }
  }
</style>

      <svg class="overlay" viewBox="0 0 1214 1295" aria-hidden="true">
        <!-- Écran de télé qui scintille -->

        <!-- Compteur à palettes sur le tableau noir -->
        <g transform="translate(660 309) rotate(-7)">
          <rect class="tile" x="-35" y="-56" width="70" height="112" rx="6"/>
          <g class="digit" id="dg0"><text class="num" id="d0" x="0" y="4">0</text></g>
          <line class="seam" x1="-35" y1="0" x2="35" y2="0"/>

        <g transform="translate(730 299) rotate(-7)">
          <rect class="tile" x="-35" y="-56" width="70" height="112" rx="6"/>
          <g class="digit" id="dg1"><text class="num" id="d1" x="0" y="4">2</text></g>
          <line class="seam" x1="-35" y1="0" x2="35" y2="0"/>
        </g>
        <g transform="translate(799 290) rotate(-7)">
          <rect class="tile" x="-35" y="-56" width="70" height="112" rx="6"/>
          <g class="digit" id="dg2"><text class="num" id="d2" x="0" y="4">6</text></g>
          <line class="seam" x1="-35" y1="0" x2="35" y2="0"/>
        </g>

        <!-- Larmes qui gouttent du menton et du visage -->
        <g>
          <circle class="fall" cx="323" cy="482" r="9" style="animation-delay:0s"/>
          <circle class="fall" cx="336" cy="440" r="7" style="animation-delay:0.7s"/>
          <circle class="fall" cx="472" cy="436" r="8" style="animation-delay:0.35s"/>
          <circle class="fall" cx="488" cy="470" r="6" style="animation-delay:1.1s"/>
        </g>

        <!-- Gouttes qui giclent en continu -->
        <g>
          <circle class="spark loop" cx="452" cy="262" r="9" style="--dx:110px;--up:-45px;--dy:90px;animation-delay:0s"/>
          <circle class="spark loop" cx="448" cy="290" r="7" style="--dx:95px;--up:-25px;--dy:120px;animation-delay:0.5s"/>
          <circle class="spark loop" cx="458" cy="318" r="6" style="--dx:80px;--up:-10px;--dy:150px;animation-delay:0.9s"/>
          <circle class="spark loop" cx="330" cy="300" r="7" style="--dx:-95px;--up:-30px;--dy:110px;animation-delay:0.3s"/>

      </svg>

  </figure>

  <section class="below">
    <div class="clock" role="timer" aria-label="Temps écoulé depuis la dernière victoire">
      <div class="d"><b id="days">26</b><span id="days-label">jours</span></div>
      <div><b id="hh">00</b><span>heures</span></div>
      <div><b id="mm">00</b><span>minutes</span></div>
      <div><b id="ss">00</b><span>secondes</span></div>
    </div>

    <div class="talk">
      <div>
        <p class="verdict" id="verdict"></p>
        <p class="last-win">Dernière victoire : <strong>jeudi 17 septembre 2026</strong></p>
        <p class="hug" id="hug" aria-live="polite">Consolations : 0</p>
      </div>
      <button type="button" id="console">Le consoler</button>
    </div>
  </section>
</main>

<script>
  var START = new Date('2026-09-17T00:00:00+02:00').getTime();
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var NS = 'http://www.w3.org/2000/svg';

  function pad(n) { return n < 10 ? '0' + n : String(n); }

  function verdictFor(days) {
    if (days < 1) return "Il est encore tout sourire. Ça ne durera pas.";
    if (days < 7) return "C'est récent. Il dit que c'était la faute de la balle.";
    if (days < 21) return "Il s'entraîne seul, le soir, contre le mur.";
    if (days < 60) return "Il a demandé la revanche à la table. Elle a dit non.";
    if (days < 120) return "Il a nommé la barre des défenseurs. Elle s'appelle Gérard.";
    return "Il ne joue plus, il pleure juste devant la table.";
  }

  /* Palettes du tableau noir */
  var shown = [-1, -1, -1];

  function setBoard(n) {
    n = Math.max(0, Math.min(999, n));
    var s = String(n);
    while (s.length < 3) s = '0' + s;
    for (var i = 0; i < 3; i++) {
      var v = Number(s.charAt(i));
      if (shown[i] !== v) {
        shown[i] = v;
        document.getElementById('d' + i).textContent = s.charAt(i);
        var g = document.getElementById('dg' + i);
        g.classList.remove('flip');
        void g.getBoundingClientRect();
        g.classList.add('flip');
      }
    }
  }

  function countUp(target) {
    if (reduce || target < 1) { setBoard(target); return; }
    var t0 = null, dur = 1800;
    function step(t) {
      if (t0 === null) t0 = t;
      var p = Math.min(1, (t - t0) / dur);
      var eased = 1 - Math.pow(1 - p, 3);
      setBoard(Math.round(target * eased));
      if (p < 1) requestAnimationFrame(step); else setBoard(target);
    }
    requestAnimationFrame(step);
  }

  var lastDays = -1, started = false;

  function tick() {
    var d = Date.now() - START;
    if (d < 0) d = 0;
    var days = Math.floor(d / 86400000);
    var h = Math.floor((d % 86400000) / 3600000);
    var m = Math.floor((d % 3600000) / 60000);
    var s = Math.floor((d % 60000) / 1000);

    document.getElementById('days').textContent = days;
    document.getElementById('days-label').textContent = days > 1 ? 'jours' : 'jour';
    document.getElementById('hh').textContent = pad(h);
    document.getElementById('mm').textContent = pad(m);
    document.getElementById('ss').textContent = pad(s);

    if (days !== lastDays) {
      lastDays = days;
      document.getElementById('verdict').textContent = verdictFor(days);
      if (!started) { started = true; countUp(days); } else { setBoard(days); }
    }
  }

  /* Gerbe de larmes au clic */
  function burst() {
    var g = document.getElementById('burst');
    var origins = [[428, 268], [330, 300]];
    for (var i = 0; i < 16; i++) {
      var o = origins[i % 2];
      var c = document.createElementNS(NS, 'circle');
      var left = (i % 2 === 1);
      var dx = (left ? -1 : 1) * (60 + Math.random() * 160);
      c.setAttribute('class', 'spark');
      c.setAttribute('cx', o[0]);
      c.setAttribute('cy', o[1]);
      c.setAttribute('r', 5 + Math.random() * 6);
      c.style.setProperty('--dx', dx.toFixed(0) + 'px');
      c.style.setProperty('--up', (-30 - Math.random() * 70).toFixed(0) + 'px');
      c.style.setProperty('--dy', (80 + Math.random() * 200).toFixed(0) + 'px');
      c.style.animationDelay = (Math.random() * 0.25).toFixed(2) + 's';
      c.addEventListener('animationend', function (e) {
        if (e.target.parentNode) e.target.parentNode.removeChild(e.target);
      });
      g.appendChild(c);
    }
  }

  var hugs = 0;
  function consoleHim() {
    hugs++;
    document.getElementById('hug').textContent =
      'Consolations : ' + hugs + (hugs > 2 ? '. Aucun effet.' : '');
    if (!reduce) burst();
  }

  document.getElementById('console').addEventListener('click', consoleHim);
  document.getElementById('scene').addEventListener('click', consoleHim);
  document.getElementById('scene').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); consoleHim(); }
  });

  tick();
  setInterval(tick, 1000);
</script>
